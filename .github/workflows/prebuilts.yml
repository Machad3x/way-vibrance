#
# Builds the per-distro prebuilt packages (scripts/package.sh) whenever a
# v* tag is pushed and attaches them to that tag's GitHub release. Uses
# docker (available on GH runners); it is the same matrix that is verified
# locally with podman. Package targets are the upstream-supported releases
# listed in scripts/package.sh — keep them current there and CI follows.

name: prebuilts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag/release to attach artifacts to (empty = triggered ref)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  matcher-tests:
    # Cheap, versioned guarantee for the profile glob matcher: fuzz
    # equivalence against the frozen regex reference + budget ceilings.
    # Must pass before the packaging matrix is worth its artifacts.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read   # this job reads the repo and runs a test; nothing else
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 dev tooling
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends cmake qt6-base-dev
      - name: Build and run matcher tests
        # Standalone: the harness needs only Qt6::Core + the private header
        # (a full cmake configure here would demand KWin packages).
        run: |
          g++ -O1 -std=c++17 -fPIC tests/glob_match_test.cpp -Ieffect \
            $(pkg-config --cflags --libs Qt6Core) -o glob_match_test
          ./glob_match_test

  packages:
    needs: matcher-tests   # a red matcher fuzz must gate the artifacts (jobs
                           # run in parallel without this)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write      # release asset attach/clear only
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag (validated)
        # NEVER interpolate ${{ }} into shell: workflow_dispatch inputs are
        # attacker-controllable strings (script injection + token exposure).
        # The value crosses into shell via env only, must match a plain
        # semver tag, and flows onward via GITHUB_OUTPUT.
        id: rel
        env:
          WANT: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$WANT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid release tag" >&2; exit 1; }
          echo "tag=$WANT" >> "$GITHUB_OUTPUT"

      - name: Build + install-verify all supported releases
        run: CONTAINER_TOOL=docker ./scripts/package.sh

      - name: List artifacts
        run: ls -la dist/

      - name: Clear existing assets first (idempotent re-attach)
        # Overwrite via softprops matches assets by name, but GitHub
        # sanitizes '~' to '.' in display names (Debian versions) — so any
        # pre-existing upload (manual or CI) must be deleted first, else the
        # step fails with "already_exists".
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          for f in dist/*.rpm dist/*.deb dist/*.pkg.tar.zst; do
            [ -e "$f" ] || continue
            name="$(basename "$f")"
            gh release delete-asset "$REL" "$name" --yes 2>/dev/null || true
            gh release delete-asset "$REL" "${name//\~/.}" --yes 2>/dev/null || true
          done

      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: |
            dist/*.rpm
            dist/*.deb
            dist/*.pkg.tar.zst
          make_latest: "false"
